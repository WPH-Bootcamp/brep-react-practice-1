<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 4 - List</title>
  </head>
  <body>
    <h1>Materi 4 - List</h1>

    <h2>1. Un-Ordered List (ul)</h2>
    <ul>
      <li>Nasi Padang</li>
      <li>Nasi Goreng</li>
      <li>Nasi Bakar</li>
    </ul>

    <h2>2. Ordered List (ul)</h2>
    <ol type="A" start="2">
      <li>Nasi Padang</li>
      <li>Nasi Goreng</li>
      <li>Nasi Bakar</li>
    </ol>
  </body>
</html>
